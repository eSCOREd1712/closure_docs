services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: harness-proj1:latest
    container_name: harness-proj1
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
